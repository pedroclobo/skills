<!-- ============================================================
  COURSE PAGE TEMPLATE — copy to <course>/index.html

  The table of contents for one course. Everything below the .why
  paragraph is rendered by teach.js from ./course.js, so this file
  changes only when the course title or the mission's Why changes.

  Fill in: the <title>, the h1, and the .why paragraph, which is
  the first paragraph of MISSION.md's "## Why" in plain teacher voice.
  Courses with no MISSION.md get a one-line placeholder instead.

  Delete every template comment before saving.
============================================================ -->
<title>COURSE TITLE</title>
<link rel="stylesheet" href="../assets/teach.css">
</head>
<body class="page-course">

<main class="inner">

  <a class="up" href="../index.html">← Courses</a>
  <h1>Course title</h1>
  <p class="why">Why the user is learning this, in two or three sentences.</p>

  <div data-toc></div>

  <div class="refs">
    <div class="grp">Reference</div>
    <div data-reference></div>
  </div>

</main>

<script src="course.js"></script>
<script src="../assets/teach.js"></script>
</body>
</html>
